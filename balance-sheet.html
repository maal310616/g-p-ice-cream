<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Balance Sheet</title><style>body{font:16px system-ui;max-width:900px;margin:auto;padding:28px;background:#071229;color:#eef5ff}.box{background:#101f42;padding:22px;border-radius:18px;margin:14px 0}label{display:inline-block;width:30%;margin:8px 0;color:#adc1e8}input{display:block;width:90%;padding:9px;border-radius:7px;background:#182d58;color:#ffd66e;border:1px solid #486596}table{width:100%;border-collapse:collapse}td{padding:10px;border-bottom:1px solid #2e4a7e}.total{font-weight:800;color:#72ead2}@media(max-width:650px){label{width:48%}}</style><main><h1>Balance Sheet</h1><p>Enter the closing position for any season. Totals update automatically.</p><section class=box><h2>Inputs</h2><label>Closing cash<input id=c value=73546 type=number></label><label>Machine purchase cost<input id=mc value=35000 type=number></label><label>Accumulated depreciation<input id=ad value=4375 type=number></label><label>Outstanding loans<input id=d value=0 type=number></label><label>Unused tax losses<input id=t value=0 type=number></label><label>Other assets<input id=o value=0 type=number></label></section><section class=box><h2>Statement</h2><table id=out></table></section></main><script>const ids=['c','mc','ad','d','t','o'];function money(x){return 'Sh '+Math.round(x).toLocaleString()}function draw(){let c=+document.querySelector('#c').value||0,mc=+document.querySelector('#mc').value||0,ad=+document.querySelector('#ad').value||0,d=+document.querySelector('#d').value||0,t=+document.querySelector('#t').value||0,o=+document.querySelector('#o').value||0,net=mc-ad,assets=c+net+o,equity=assets-d;out.innerHTML=`<tr><td>Cash</td><td>${money(c)}</td></tr><tr><td>Machines at net book value</td><td>${money(net)}</td></tr><tr><td>Other assets</td><td>${money(o)}</td></tr><tr class=total><td>Total assets</td><td>${money(assets)}</td></tr><tr><td>Outstanding loans</td><td>${money(d)}</td></tr><tr><td>Tax-loss pool (memo)</td><td>${money(t)}</td></tr><tr class=total><td>Owner equity</td><td>${money(equity)}</td></tr>`}ids.forEach(id=>document.querySelector('#'+id).oninput=draw);draw();</script></html>
